# The phone camera relay (worker.js). Deploy with: npx wrangler deploy
name = "rec-camera"
main = "worker.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
